<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIRIT'S - OUTILS</title>
  <link rel="stylesheet" href="../CSS/outils.css">
</head>
<body>

<div class="container50">
  
  <div>Bibliothèque <br><strong>D'OUTILS</strong>
          <div class="info-box">
  💡 <strong>OUTILS</strong> vous permet de télécharger des éléments qui vous aideront dans vos taches quotidienne.
</div>
    <div>
      <p>Choisissez votre option :</p>
      <p>
        <a href="pdf.html"><button class="button" id="pdfContainer1"><span class="text" title="Documents, guides, support sous format pdf"><strong>📃Documents & Guides ></strong></span></button></a>
        <a href="scripts.html"><button class="button" id="scriptsContainer1"><span class="text" title="Scripts d'Autonomisation de taches"><strong>💻Scripts & Autonomisation ></strong></span></button></a>
        <a href="archives.html"><button class="button" id="archivesContainer1"><span class="text" title="Fichier zip d'archives et packs à outils"><strong>📦Pack & Archives ></strong></span></button></a>
        <a href="applications.html"><button class="button" id="appsContainer1"><span class="text" title="Applications"><strong>👛Applications ></strong></span></button></a>
      </p>
    </div>
  </div>
</div>

<div class="container40">
  <img src="../Images/favicon.ico" alt="Logo" class="Logo">
  <span class="site-name"><strong>OUTILS</strong></span>
</div>
<script src="../JavaScript/Security.js"></script>
</body>
<div id="listeOutils"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// 🔐 CONFIG SUPABASE
const supabase = createClient(
  "https://ccsrxvwaxkdbphesyies.supabase.co",
  "sb_publishable_SqgQjncAuFW7c5buXtpdsw_oWUuez1z"
)

// 🎯 CONTAINERS
const containers = {
  pdf: document.getElementById("pdfContainer"),
  scripts: document.getElementById("scriptsContainer"),
  archives: document.getElementById("archivesContainer"),
  apps: document.getElementById("appsContainer")
}

// 🔄 AFFICHER UNE CATÉGORIE
window.showCategory = (cat) => {
  Object.keys(containers).forEach(key => {
    containers[key].style.display = key === cat ? "block" : "none"
  })
}

// 🚀 CHARGER OUTILS
async function chargerOutils() {
  const { data, error } = await supabase.from("outils").select("*")

  if(error){
    console.error(error)
    return
  }

  // reset
  Object.values(containers).forEach(c => c.innerHTML = "")

  data.forEach(outil => {

    const container = containers[outil.categorie]
    if(!container) return

    const div = document.createElement("div")
    div.classList.add("outil-card")

    div.innerHTML = `
      <h3>${outil.nom_outil}</h3>
      <p>${outil.description || "Pas de description"}</p>
      <p><strong>Type :</strong> ${outil.type_outil}</p>
      <p><strong>Prix :</strong> ${outil.prix || 0} FCFA</p>

      ${
        outil.type_outil === "gratuit"
        ? `<a href="${outil.fichier_url}" target="_blank">
             <button>📥 Télécharger</button>
           </a>`
        : `<button class="payer-btn"
            data-id="${outil.id_outil}"
            data-prix="${outil.prix}">
            🔒 Acheter (${outil.prix} FCFA)
          </button>`
      }
    `

    container.appendChild(div)

    // 🔥 GESTION PAIEMENT
    if(outil.type_outil === "payant"){
      const payBtn = div.querySelector(".payer-btn")

      payBtn.addEventListener("click", async () => {

        const idOutil = payBtn.dataset.id
        const montant = Number(payBtn.dataset.prix)

        payBtn.innerText = "⏳ Paiement..."
        payBtn.disabled = true

        try {
          const res = await fetch("http://localhost:3000/api/payer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id_outil: idOutil,
              montant: montant
            })
          })

          const data = await res.json()

          if(data.paymentUrl){
            window.location.href = data.paymentUrl
          } else {
            alert("❌ Erreur génération paiement")
          }

        } catch(err){
          console.error(err)
          alert("❌ Erreur serveur")
        }

        payBtn.innerText = "🔒 Acheter"
        payBtn.disabled = false
      })
    }

  })
}

// 🚀 INIT
chargerOutils()
showCategory("pdf")
</script>

</body>
</html>
